<body>
  <main class="app">
    <h1>College Budget</h1>

    <section class="card">
      <p class="label">Left from your last deposit</p>
      <p id="left" class="big-number">$0.00</p>
      <p id="summary-note" class="note"></p>
    </section>

    <section class="card">
      <h2>Log an expense</h2>
      <input id="amount" type="number" inputmode="decimal" placeholder="0.00" />
      <input id="note" type="text" placeholder="Note (optional)" />
      <div id="category-buttons" class="category-grid"></div>
      <p id="error" class="error"></p>
    </section>
  </main>

  <script type="module" src="/src/main.ts"></script>
</body>
