<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Lets it work like a real app when added to a phone's home screen -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Budget" />
    <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <title>College Budget</title>
  </head>
  <body>
    <main class="app">
      <h1>College Budget</h1>

      <section class="card">
        <p class="label">Money left</p>
        <p id="left" class="big-number">$0.00</p>
        <p id="summary-note" class="note"></p>
      </section>

      <section class="card">
        <h2>Log an expense</h2>
        <input id="amount" type="number" inputmode="decimal" placeholder="0.00" />
        <input id="note" type="text" placeholder="Note (optional)" />
        <div id="category-buttons" class="category-grid"></div>
        <p id="error" class="error"></p>
      </section>

      <section class="card">
        <h2>Money coming in</h2>
        <input id="deposit-amount" type="number" inputmode="decimal" placeholder="0.00" />
        <input id="deposit-note" type="text" placeholder="Where from? (optional)" />
        <button id="log-deposit" class="primary">Add money</button>
        <p id="deposit-error" class="error"></p>
      </section>

      <section class="card">
        <div class="month-nav">
          <button id="prev-month" class="month-arrow" aria-label="Previous month">‹</button>
          <h2 id="month-title">This month</h2>
          <button id="next-month" class="month-arrow" aria-label="Next month">›</button>
        </div>
        <div class="stats">
          <div class="stat">
            <p id="stat-spent" class="stat-value">$0.00</p>
            <p class="stat-label">Spent</p>
          </div>
          <div class="stat">
            <p id="stat-logged" class="stat-value">0</p>
            <p class="stat-label">Expenses logged</p>
          </div>
        </div>
        <h3>Spending by day</h3>
        <div class="chart-box">
          <canvas id="daily-chart"></canvas>
        </div>
      </section>

      <section class="card">
        <h2>Where did it go</h2>
        <ul id="breakdown" class="breakdown"></ul>
        <p id="breakdown-empty" class="note">No spending yet this month</p>
        <div id="top-section">
          <h3>Top 5 expenses</h3>
          <ol id="top-expenses" class="top-list"></ol>
        </div>
      </section>

      <section class="card">
        <h2>Recent activity</h2>
        <ul id="activity" class="activity"></ul>
        <p id="activity-empty" class="note">Nothing logged yet</p>
      </section>
    </main>

    <dialog id="edit-dialog">
      <form id="edit-form" novalidate>
        <h2 id="edit-title">Edit</h2>
        <label>
          Amount
          <input id="edit-amount" type="number" inputmode="decimal" />
        </label>
        <label id="edit-category-label">
          Category
          <select id="edit-category"></select>
        </label>
        <label>
          Note
          <input id="edit-note" type="text" />
        </label>
        <label>
          Date
          <input id="edit-date" type="date" />
        </label>
        <p id="edit-error" class="error"></p>
        <div class="edit-buttons">
          <button type="button" id="edit-cancel">Cancel</button>
          <button type="submit" class="primary">Save</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
