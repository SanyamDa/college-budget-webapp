<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>College Budget</title>
  </head>
  <body>
    <main class="app">
      <h1>College Budget</h1>

      <section class="card">
        <p class="label">Money left</p>
        <p id="left" class="big-number">$0.00</p>
        <p id="summary-note" class="note"></p>
      </section>

      <section class="card">
        <h2>Log an expense</h2>
        <input id="amount" type="number" inputmode="decimal" placeholder="0.00" />
        <input id="note" type="text" placeholder="Note (optional)" />
        <div id="category-buttons" class="category-grid"></div>
        <p id="error" class="error"></p>
      </section>

      <section class="card">
        <h2>Money coming in</h2>
        <input id="deposit-amount" type="number" inputmode="decimal" placeholder="0.00" />
        <input id="deposit-note" type="text" placeholder="Where from? (optional)" />
        <button id="log-deposit" class="primary">Add money</button>
        <p id="deposit-error" class="error"></p>
      </section>

      <section class="card">
        <h2>Recent activity</h2>
        <ul id="activity" class="activity"></ul>
        <p id="activity-empty" class="note">Nothing logged yet</p>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
